version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: afl
      POSTGRES_PASSWORD: afl
      POSTGRES_DB: afl_tribunal
    ports:
      - "5432:5432"
    volumes:
      - afl_tribunal_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - afl_tribunal_minio:/data

volumes:
  afl_tribunal_pgdata:
  afl_tribunal_minio:
